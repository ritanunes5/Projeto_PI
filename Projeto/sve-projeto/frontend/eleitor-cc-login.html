<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login com Cartão de Cidadão</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/eleitor-cc-login.css">
</head>

<body class="cc-login-page">

    <div class="decor-line top-left"></div>
    <div class="decor-circle red"></div>
    <div class="decor-circle green"></div>
    <div class="decor-line bottom-right"></div>

    <main class="cc-login-container">

        <img src="assets/logotipo_sve.png" alt="Logotipo SVE" class="login-sve">

        <h1>Cartão de Cidadão</h1>

        <form class="cc-form">

            <label for="numero_cc">Número do Cartão de Cidadão</label>
            <input
                type="text"
                id="numero_cc"
                maxlength="9"
                pattern="[0-9]{9}"
                placeholder="Insira os 9 dígitos"
                required
            >

            <button type="submit" class="landing-btn">
                VALIDAR IDENTIDADE
            </button>

            <a href="eleitor-login.html" class="back-link">
                Voltar
            </a>

        </form>

    </main>

    <script>
        const form = document.querySelector(".cc-form");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const numeroCC = document.getElementById("numero_cc").value;

            try {
                const response = await fetch("http://localhost:8001/login_cc", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        numero_identificacao: numeroCC
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.detail);
                    return;
                }

                alert("Login realizado com sucesso!");

                localStorage.setItem("user_id", data.id);
                localStorage.setItem("user_nome", data.nome);

                window.location.href = "eleitor-dashboard.html";

            } catch (error) {
                console.error(error);
                alert("Erro ao ligar ao servidor.");
            }
        });
    </script>

</body>
</html>
