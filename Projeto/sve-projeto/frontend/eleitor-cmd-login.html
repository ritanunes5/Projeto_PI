<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CMD</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/eleitor-cmd-login.css">
</head>

<body class="cmd-login-page">

    <div class="decor-line top-left"></div>
    <div class="decor-circle red"></div>
    <div class="decor-circle green"></div>
    <div class="decor-line bottom-right"></div>

    <main class="cmd-login-container">

        <img src="assets/logotipo_sve.png" alt="Logotipo SVE" class="login-sve">

        <h1>Chave Móvel Digital</h1>

        <form class="cmd-form">

            <label for="numero_tlm">Número de Telemóvel</label>
            <input
                type="text"
                id="numero_tlm"
                maxlength="9"
                pattern="[0-9]{9}"
                placeholder="Insira os 9 dígitos"
                required
            >

            <label for="pin">PIN CMD</label>
            <input
                type="password"
                id="pin"
                maxlength="4"
                pattern="[0-9]{4}"
                placeholder="Insira o PIN de 4 dígitos"
                required
            >

            <button type="submit" class="landing-btn">
                VALIDAR IDENTIDADE
            </button>

            <a href="eleitor-login.html" class="back-link">
                Voltar
            </a>

        </form>

    </main>

    <script>
        const form = document.querySelector(".cmd-form");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const telefone = document.getElementById("numero_tlm").value;
            const codigo = document.getElementById("pin").value;

            try {
                const response = await fetch("http://localhost:8001/login_cmd", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        telefone: telefone,
                        codigo: codigo
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.detail);
                    return;
                }

                alert("Login realizado com sucesso!");

                localStorage.setItem("user_id", data.id);
                localStorage.setItem("user_nome", data.nome);

                window.location.href = "eleitor-dashboard.html";

            } catch (error) {
                console.error(error);
                alert("Erro ao ligar ao servidor.");
            }
        });
    </script>

</body>
</html>
